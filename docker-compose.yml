# =============================================================================
# StreamOps - Docker Compose Configuration
# Complete application stack for production deployment
# =============================================================================

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: streamops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-streamops}
      POSTGRES_USER: ${POSTGRES_USER:-streamops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streamops_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-streamops}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - streamops-network

  # Redis (Optional - for caching)
  redis:
    image: redis:7-alpine
    container_name: streamops-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - streamops-network
    profiles:
      - with-redis

  # API Server
  api-server:
    build:
      context: .
      dockerfile: apps/api-server/Dockerfile
    container_name: streamops-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${API_PORT:-8080}
      DATABASE_URL: postgresql://${POSTGRES_USER:-streamops}:${POSTGRES_PASSWORD:-streamops_password}@postgres:5432/${POSTGRES_DB:-streamops}
      REDIS_URL: redis://redis:6379
      PAYME_MERCHANT_ID: ${PAYME_MERCHANT_ID}
      PAYME_KEY: ${PAYME_KEY}
      PAYME_IS_TEST: ${PAYME_IS_TEST:-false}
      P2P_ENABLED: ${P2P_ENABLED:-false}
      P2P_MERCHANT_ID: ${P2P_MERCHANT_ID:-}
      P2P_SECRET_KEY: ${P2P_SECRET_KEY:-}
      P2P_API_URL: ${P2P_API_URL:-}
      P2P_CHECKOUT_BASE_URL: ${P2P_CHECKOUT_BASE_URL:-}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS}
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - upload_data:/var/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/api/healthz', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - streamops-network

  # Dashboard (React + Nginx)
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: streamops-dashboard
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "${DASHBOARD_PORT:-3000}:80"
    depends_on:
      - api-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - streamops-network

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:1.27-alpine
    container_name: streamops-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - api-server
      - dashboard
    networks:
      - streamops-network
    profiles:
      - with-nginx

networks:
  streamops-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  upload_data:
    driver: local
