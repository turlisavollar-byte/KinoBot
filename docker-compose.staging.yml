services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kinobot_staging
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 384m
    cpus: 0.3
    networks:
      - staging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - staging_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 96m
    cpus: 0.1
    networks:
      - staging

  db-init:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_DB: kinobot_staging
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
    command:
      - sh
      - -ec
      - |
        until pg_isready -h postgres -U postgres -d "$$POSTGRES_DB"; do sleep 2; done
        PGPASSWORD="$$POSTGRES_PASSWORD" psql -h postgres -U postgres -d "$$POSTGRES_DB" -v ON_ERROR_STOP=1 -v app_password="$$APP_DB_PASSWORD" -v database_name="$$POSTGRES_DB" <<'SQL'
        SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', 'staging_user', :'app_password')
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'staging_user')
        \gexec
        SELECT format('ALTER ROLE %I WITH LOGIN PASSWORD %L', 'staging_user', :'app_password')
        \gexec
        SELECT format('GRANT CONNECT ON DATABASE %I TO %I', :'database_name', 'staging_user')
        \gexec
        GRANT USAGE ON SCHEMA public TO staging_user;
        GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO staging_user;
        GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO staging_user;
        ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT ALL PRIVILEGES ON TABLES TO staging_user;
        ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT ALL PRIVILEGES ON SEQUENCES TO staging_user;
        SQL
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.1
    networks:
      - staging

  db-migrator:
    build:
      context: .
      dockerfile: apps/api-server/Dockerfile
    restart: "no"
    working_dir: /app/lib/db
    command:
      - sh
      - -ec
      - node /app/lib/db/scripts/assert-migration-state.mjs && node /app/lib/db/scripts/migrate-live.mjs
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/kinobot_staging
    depends_on:
      db-init:
        condition: service_completed_successfully
    mem_limit: 512m
    cpus: 0.3
    networks:
      - staging

  api-server:
    build:
      context: .
      dockerfile: apps/api-server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgresql://staging_user:${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}@postgres:5432/kinobot_staging
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_POLLING_ENABLED: "false"
      ADMIN_TELEGRAM_IDS: ""
      CORS_ORIGINS: ${STAGING_URL:?STAGING_URL is required}
      LOG_LEVEL: info
      LOG_FORMAT: json
      BCRYPT_SALT_ROUNDS: "12"
      AWS_EC2_METADATA_DISABLED: "true"
      S3_ENDPOINT: ""
      S3_ACCESS_KEY_ID: ""
      S3_SECRET_ACCESS_KEY: ""
    volumes:
      - staging_uploads:/var/uploads
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8080/api/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    mem_limit: 512m
    cpus: 0.5
    networks:
      - staging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_APP_URL: ${STAGING_URL:?STAGING_URL is required}
        NEXT_BASE_PATH: /web
    restart: unless-stopped
    environment:
      API_URL: http://api-server:8080
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_APP_URL: ${STAGING_URL:?STAGING_URL is required}
      NODE_ENV: production
      PORT: 3000
      NODE_OPTIONS: --max-old-space-size=384
    depends_on:
      api-server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/web').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    cpus: 0.4
    networks:
      - staging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8444:443"
    volumes:
      - ./nginx/nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ${STAGING_TLS_CERT_FILE:?STAGING_TLS_CERT_FILE is required}:/etc/nginx/ssl/cert.pem:ro
      - ${STAGING_TLS_KEY_FILE:?STAGING_TLS_KEY_FILE is required}:/etc/nginx/ssl/key.pem:ro
    depends_on:
      api-server:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-check-certificate -qO- https://127.0.0.1/healthz >/dev/null",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: 64m
    cpus: 0.1
    networks:
      - staging

networks:
  staging:
    name: kinobot-v2-staging-net

volumes:
  staging_postgres_data:
    name: kinobot-v2-staging_postgres_data
  staging_redis_data:
    name: kinobot-v2-staging_redis_data
  staging_uploads:
    name: kinobot-v2-staging_uploads
