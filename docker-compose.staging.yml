services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kinobot_staging
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 384m
    cpus: 0.3
    networks:
      - staging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - staging_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 96m
    cpus: 0.1
    networks:
      - staging

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - staging_minio_data:/data
    mem_limit: 512m
    cpus: 0.3
    networks:
      - staging

  minio-init:
    image: minio/mc:latest
    restart: "no"
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        until mc alias set staging http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done
        mc mb --ignore-existing "staging/$$VIDEO_BUCKET"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      VIDEO_BUCKET: ${VIDEO_BUCKET:?VIDEO_BUCKET is required}
    depends_on:
      minio:
        condition: service_started
    mem_limit: 128m
    cpus: 0.1
    networks:
      - staging

  db-migrator:
    build:
      context: .
      dockerfile: apps/api-server/Dockerfile
    restart: "no"
    working_dir: /app/lib/db
    command:
      - sh
      - -ec
      - node /app/lib/db/scripts/assert-migration-state.mjs && node /app/lib/db/scripts/migrate-live.mjs
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://kinobot_migrator:${MIGRATOR_PASSWORD:?MIGRATOR_PASSWORD is required}@postgres:5432/kinobot_staging
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    cpus: 0.3
    networks:
      - staging

  api-server:
    build:
      context: .
      dockerfile: apps/api-server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgresql://kinobot_app:${APP_PASSWORD:?APP_PASSWORD is required}@postgres:5432/kinobot_staging
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_POLLING_ENABLED: "false"
      ADMIN_TELEGRAM_IDS: ""
      VIDEO_BUCKET: ${VIDEO_BUCKET:?VIDEO_BUCKET is required}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      CORS_ORIGINS: ${STAGING_URL:?STAGING_URL is required}
      LOG_LEVEL: info
      LOG_FORMAT: json
      BCRYPT_SALT_ROUNDS: "12"
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - staging_uploads:/var/uploads
    depends_on:
      db-migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8080/api/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    mem_limit: 512m
    cpus: 0.5
    networks:
      - staging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_APP_URL: ${STAGING_URL:?STAGING_URL is required}
        NEXT_BASE_PATH: /web
    restart: unless-stopped
    environment:
      API_URL: http://api-server:8080
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_APP_URL: ${STAGING_URL:?STAGING_URL is required}
      NODE_ENV: production
      PORT: 3000
      NODE_OPTIONS: --max-old-space-size=384
    depends_on:
      api-server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/web').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    cpus: 0.4
    networks:
      - staging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8444:8443"
    volumes:
      - ./nginx/nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ${STAGING_TLS_CERT_FILE:?STAGING_TLS_CERT_FILE is required}:/etc/nginx/ssl/cert.pem:ro
      - ${STAGING_TLS_KEY_FILE:?STAGING_TLS_KEY_FILE is required}:/etc/nginx/ssl/key.pem:ro
    depends_on:
      api-server:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-check-certificate -qO- https://127.0.0.1:8443/healthz >/dev/null",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: 64m
    cpus: 0.1
    networks:
      - staging

networks:
  staging:
    name: kinobot-v2-staging-net

volumes:
  staging_postgres_data:
    name: kinobot-v2-staging_postgres_data
  staging_redis_data:
    name: kinobot-v2-staging_redis_data
  staging_minio_data:
    name: kinobot-v2-staging_minio_data
  staging_uploads:
    name: kinobot-v2-staging_uploads
