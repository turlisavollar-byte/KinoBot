openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Movie streaming platform API — enterprise modular monolith
servers:
  - url: /api
    description: Base API path
tags:
  - name: actors
    description: Actor management
  - name: admin-users
    description: Administrative account operations
  - name: analytics
    description: Dashboard analytics & statistics
  - name: auth
    description: Legacy identity & authentication (deprecated - use identity-auth)
  - name: billing
    description: Payments & invoices
  - name: catalog
    description: Movies, series, seasons, episodes
  - name: genres
    description: Genre management
  - name: identity-auth
    description: New Identity module authentication (JWT-based)
  - name: notifications
    description: Notification management
  - name: subscriptions
    description: Subscription plans & user subscriptions
  - name: telegram
    description: Telegram bot & storage management
  - name: users
    description: User management operations
  - name: video-codes
    description: Video code management
paths:
  /actors:
    get:
      operationId: listActors
      tags:
        - actors
      summary: List all actors
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Actors list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Actor'
    post:
      operationId: createActor
      tags:
        - actors
      summary: Create a new actor
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActorBody'
      responses:
        '201':
          description: Actor created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
  /actors/{id}:
    patch:
      operationId: updateActor
      tags:
        - actors
      summary: Update actor
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateActorBody'
      responses:
        '200':
          description: Updated actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
  /admin-users:
    get:
      operationId: listAdminUsers
      tags:
        - admin-users
      summary: List administrative users
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by name, email, or role
      responses:
        '200':
          description: Administrative users retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccountListResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /admin-users/{id}:
    patch:
      operationId: updateAdminUser
      tags:
        - admin-users
      summary: Update an administrative account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdminUserBody'
      responses:
        '200':
          description: Administrative account updated
        '400':
          description: Invalid request
        '403':
          description: Forbidden
        '404':
          description: Not found
    delete:
      operationId: deleteAdminUser
      tags:
        - admin-users
      summary: Delete an administrative account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Administrative account deleted
        '403':
          description: Forbidden
        '404':
          description: Not found
  /analytics/overview:
    get:
      operationId: getAnalyticsOverview
      tags:
        - analytics
      summary: Get dashboard overview stats
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: period
          in: query
          schema:
            type: string
            enum:
              - 7d
              - 30d
              - 90d
              - 1y
      responses:
        '200':
          description: Overview stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OverviewStats'
  /analytics/revenue-trend:
    get:
      operationId: getRevenueTrend
      tags:
        - analytics
      summary: Revenue over time
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: period
          in: query
          schema:
            type: string
            enum:
              - 7d
              - 30d
              - 90d
              - 1y
        - name: groupBy
          in: query
          schema:
            type: string
            enum:
              - day
              - week
              - month
        - name: includeRefunds
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Revenue trend data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                            revenue:
                              type: number
                            count:
                              type: integer
  /analytics/top-content:
    get:
      operationId: getTopContent
      tags:
        - analytics
      summary: Top viewed movies and series
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: period
          in: query
          schema:
            type: string
            enum:
              - 7d
              - 30d
              - 90d
              - 1y
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Top content list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            title:
                              type: string
                            type:
                              type: string
                            posterUrl:
                              type:
                                - string
                                - 'null'
                            viewsCount:
                              type: integer
                            rating:
                              type: number
  /analytics/subscription-trend:
    get:
      operationId: getSubscriptionTrend
      tags:
        - analytics
      summary: New subscriptions trend over time
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: period
          in: query
          schema:
            type: string
            enum:
              - 7d
              - 30d
              - 90d
              - 1y
      responses:
        '200':
          description: Subscription trend data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                            newSubscriptions:
                              type: integer
  /analytics/invalidate-cache:
    post:
      operationId: invalidateAnalyticsCache
      tags:
        - analytics
      summary: Invalidate analytics cache
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cache invalidated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
  /analytics/video-codes:
    get:
      operationId: getVideoCodeStats
      tags:
        - analytics
      summary: Get video code statistics
      security:
        - bearerAuth: []
      parameters:
        - name: groupBy
          in: query
          schema:
            type: string
            enum:
              - status
              - channel
      responses:
        '200':
          description: Video code stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  active:
                    type: integer
                  pending:
                    type: integer
                  views:
                    type: integer
                  topCodes:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        title:
                          type: string
                        viewsCount:
                          type: integer
                        status:
                          type: string
  /auth/login:
    post:
      operationId: login
      tags:
        - auth
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '401':
          description: Invalid credentials
  /billing/plans:
    get:
      operationId: listBillingPlans
      tags:
        - billing
      summary: List billing plans
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: active_only
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Plans list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BillingPlan'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      operationId: createBillingPlan
      tags:
        - billing
      summary: Create a new billing plan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBillingPlanBody'
      responses:
        '201':
          description: Plan created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/BillingPlan'
  /billing/plans/{id}:
    get:
      operationId: getBillingPlan
      tags:
        - billing
      summary: Get billing plan by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plan detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/BillingPlan'
    put:
      operationId: updateBillingPlan
      tags:
        - billing
      summary: Update billing plan
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBillingPlanBody'
      responses:
        '200':
          description: Plan updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/BillingPlan'
    delete:
      operationId: deleteBillingPlan
      tags:
        - billing
      summary: Delete billing plan
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Plan deleted
  /billing/subscriptions:
    post:
      operationId: createBillingSubscription
