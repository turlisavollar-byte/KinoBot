                  data:
                    $ref: '#/components/schemas/BillingSubscription'
  /billing/subscriptions/user/{userId}:
    get:
      operationId: listUserSubscriptions
      tags:
        - billing
      summary: List user subscriptions
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Subscriptions list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BillingSubscription'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
  /billing/subscriptions/{id}:
    get:
      operationId: getBillingSubscription
      tags:
        - billing
      summary: Get subscription by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Subscription detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/BillingSubscription'
  /billing/subscriptions/{id}/cancel:
    patch:
      operationId: cancelBillingSubscription
      tags:
        - billing
      summary: Cancel subscription
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelSubscriptionBody'
      responses:
        '200':
          description: Subscription cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/BillingSubscription'
  /billing/invoices:
    post:
      operationId: createInvoice
      tags:
        - billing
      summary: Create a new invoice
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoiceBody'
      responses:
        '201':
          description: Invoice created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/BillingInvoice'
