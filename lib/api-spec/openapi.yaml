        activeUsers:
          type: integer
        newUsersToday:
          type: integer
        totalMovies:
          type: integer
        totalSeries:
          type: integer
        totalEpisodes:
          type: integer
        activeSubscriptions:
          type: integer
        monthlyRevenue:
          type: number
        totalRevenue:
          type: number
        totalWatchSessions:
          type: integer
        totalVideoCodes:
          type: integer
        activeVideoCodes:
          type: integer
        totalCodeViews:
          type: integer
    RevenueTrend:
      type: object
      properties:
        period:
          type: string
        totalRevenue:
          type: number
        totalTransactions:
          type: integer
        averageRevenue:
          type: number
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        data:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
              revenue:
                type: number
              transactions:
                type: integer
    TopContent:
      type: object
      properties:
