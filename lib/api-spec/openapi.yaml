components:
  schemas:
    Actor:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        photoUrl:
          type: string
        bio:
          type: string
    CreateActorBody:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        photoUrl:
          type: string
        bio:
          type: string
    UpdateActorBody:
      type: object
      properties:
        name:
          type: string
        photoUrl:
          type: string
        bio:
          type: string
    AdminAccount:
      type: object
      required:
        - id
        - email
        - name
        - role
        - status
        - isActive
        - lastLoginAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum:
            - superadmin
            - admin
            - manager
            - moderator
            - user
            - viewer
        status:
          type: string
          enum:
            - active
            - inactive
            - suspended
        isActive:
          type: boolean
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AdminAccountListResponse:
      type: object
      required:
        - success
        - data
        - meta
        - timestamp
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminAccount'
        meta:
          type: object
          required:
            - total
          properties:
            total:
              type: integer
        timestamp:
          type: string
          format: date-time
    UpdateAdminUserBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - superadmin
            - admin
            - manager
            - moderator
            - user
            - viewer
    OverviewStats:
      type: object
      required:
        - totalUsers
        - activeUsers
        - totalMovies
        - totalSeries
        - totalEpisodes
        - activeSubscriptions
        - monthlyRevenue
        - totalRevenue
