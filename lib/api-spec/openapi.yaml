  /users:
    get:
      operationId: listUsers
      tags:
        - users
      summary: List users with advanced filtering
      description: |
        Get paginated list of users with advanced filtering options.
        Supports search, status, role, date range, and sorting.
        Requires `users:read` permission.
        Data is cached for 5 minutes.
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by username, first name, last name, telegram ID, or email
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - inactive
              - blocked
              - deleted
              - suspended
          description: Filter by user status
        - name: role
          in: query
          schema:
            type: string
            enum:
              - superadmin
              - admin
              - manager
              - moderator
              - user
              - viewer
          description: Filter by user role
        - name: isActive
          in: query
          schema:
            type: boolean
          description: Filter by active status
        - name: isBlocked
          in: query
          schema:
            type: boolean
          description: Filter by blocked status
        - name: isDeleted
          in: query
          schema:
            type: boolean
          description: Filter by deleted status
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
          description: Filter users created after this date (ISO 8601)
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
          description: Filter users created before this date (ISO 8601)
        - name: sortBy
          in: query
          schema:
            type: string
            enum:
              - createdAt
              - updatedAt
              - lastLoginAt
              - username
            default: createdAt
          description: Sort field
        - name: sortOrder
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
          description: Sort order
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of users per page
        - name: includeDeleted
          in: query
          schema:
            type: boolean
            default: false
          description: Include soft-deleted users
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/{id}:
