components:
  schemas:
    PaginationMeta:
      type: object
      required:
        - total
        - page
        - limit
        - totalPages
        - hasNext
        - hasPrevious
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean
    BillingPlan:
      type: object
      required:
        - id
        - name
        - priceCents
        - currency
        - interval
        - isActive
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        priceCents:
          type: integer
        currency:
          type: string
          default: usd
        interval:
          type: string
          enum:
            - monthly
            - yearly
            - one_time
        isActive:
          type: boolean
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateBillingPlanBody:
      type: object
      required:
        - name
        - priceCents
        - interval
      properties:
        name:
          type: string
        description:
          type: string
        priceCents:
          type: integer
        currency:
          type: string
          default: usd
        interval:
          type: string
          enum:
            - monthly
            - yearly
            - one_time
        isActive:
          type: boolean
          default: true
        metadata:
          type: object
          additionalProperties: true
    UpdateBillingPlanBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        priceCents:
          type: integer
        isActive:
          type: boolean
        metadata:
          type: object
          additionalProperties: true
    BillingSubscription:
      type: object
      required:
        - id
        - userId
        - planId
        - status
        - currentPeriodStart
        - currentPeriodEnd
      properties:
        id:
          type: string
        userId:
          type: string
        planId:
          type: string
        status:
          type: string
          enum:
            - active
            - canceled
            - past_due
            - trialing
            - expired
        currentPeriodStart:
          type: string
          format: date-time
        currentPeriodEnd:
          type: string
          format: date-time
        cancelAtPeriodEnd:
          type: boolean
        canceledAt:
          type: string
          format: date-time
          nullable: true
        trialEnd:
          type: string
          format: date-time
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateSubscriptionBody:
      type: object
      required:
        - userId
        - planId
      properties:
        userId:
          type: string
        planId:
          type: string
        trialEnd:
          type: string
          format: date-time
          nullable: true
    CancelSubscriptionBody:
      type: object
      properties:
        immediate:
          type: boolean
          default: false
    BillingInvoice:
      type: object
      required:
        - id
        - userId
        - amountCents
        - currency
        - status
        - lineItems
      properties:
        id:
          type: string
        userId:
          type: string
        subscriptionId:
          type: string
          nullable: true
        amountCents:
          type: integer
        currency:
          type: string
          default: usd
        status:
          type: string
          enum:
            - open
            - paid
            - void
            - uncollectible
        dueDate:
          type: string
          format: date-time
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
        lineItems:
          type: array
          items:
            type: object
            required:
              - description
              - quantity
              - unitAmountCents
            properties:
              description:
                type: string
              quantity:
                type: integer
                minimum: 1
              unitAmountCents:
                type: integer
                minimum: 0
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateInvoiceBody:
      type: object
      required:
        - userId
        - lineItems
      properties:
        userId:
          type: string
        subscriptionId:
          type: string
        currency:
          type: string
          default: usd
        dueDate:
          type: string
          format: date-time
        lineItems:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - description
              - quantity
              - unitAmountCents
            properties:
              description:
                type: string
              quantity:
                type: integer
                minimum: 1
              unitAmountCents:
                type: integer
                minimum: 0
        metadata:
          type: object
          additionalProperties: true
    BillingPayment:
      type: object
      required:
        - id
        - userId
        - amountCents
        - currency
        - status
        - provider
      properties:
        id:
          type: string
        userId:
          type: string
        invoiceId:
          type: string
          nullable: true
        amountCents:
          type: integer
        currency:
          type: string
          default: usd
        status:
          type: string
          enum:
            - pending
            - succeeded
            - failed
            - refunded
        provider:
          type: string
          enum:
            - payme
            - click
            - uzum
            - paynet
            - anor
            - nbu
            - uzcard
            - octo
            - manual
        providerPaymentId:
          type: string
          nullable: true
        failureReason:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreatePaymentBody:
      type: object
      required:
        - invoiceId
        - amountCents
        - provider
      properties:
        invoiceId:
          type: string
        amountCents:
          type: integer
        currency:
          type: string
          default: usd
        provider:
          type: string
          enum:
            - payme
            - click
