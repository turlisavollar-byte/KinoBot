openapi: 3.1.0
info:
  title: Billing API
  version: 0.1.0
  description: Payments & invoices

tags:
  - name: billing
    description: Payments & invoices

paths:
  /billing/plans:
    get:
      operationId: listBillingPlans
      tags: [billing]
      summary: List billing plans
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: active_only
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Plans list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BillingPlan"
                  pagination:
                    $ref: "#/components/schemas/PaginationMeta"
    post:
      operationId: createBillingPlan
      tags: [billing]
      summary: Create a new billing plan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBillingPlanBody"
      responses:
        "201":
          description: Plan created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/BillingPlan"
  /billing/plans/{id}:
    get:
      operationId: getBillingPlan
      tags: [billing]
      summary: Get billing plan by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Plan detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/BillingPlan"
    put:
      operationId: updateBillingPlan
      tags: [billing]
      summary: Update billing plan
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBillingPlanBody"
      responses:
        "200":
          description: Plan updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/BillingPlan"
    delete:
      operationId: deleteBillingPlan
      tags: [billing]
      summary: Delete billing plan
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Plan deleted
  /billing/subscriptions:
    post:
      operationId: createBillingSubscription
      tags: [billing]
      summary: Create a new subscription
      security:
        - bearerAuth: []
