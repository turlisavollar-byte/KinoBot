openapi: 3.1.0
info:
  title: Analytics API
  version: 0.1.0
  description: Dashboard analytics & statistics

tags:
  - name: analytics
    description: Dashboard analytics & statistics

paths:
  /analytics/overview:
    get:
      operationId: getAnalyticsOverview
      tags: [analytics]
      summary: Get dashboard overview stats
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          schema: { type: string, format: date }
        - name: endDate
          in: query
          schema: { type: string, format: date }
        - name: period
          in: query
          schema: { type: string, enum: [7d, 30d, 90d, 1y] }
      responses:
        "200":
          description: Overview stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/OverviewStats"

  /analytics/revenue-trend:
    get:
      operationId: getRevenueTrend
      tags: [analytics]
      summary: Revenue over time
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          schema: { type: string, format: date }
        - name: endDate
          in: query
          schema: { type: string, format: date }
        - name: period
          in: query
          schema: { type: string, enum: [7d, 30d, 90d, 1y] }
        - name: groupBy
          in: query
          schema: { type: string, enum: [day, week, month] }
        - name: includeRefunds
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Revenue trend data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                            revenue:
                              type: number
                            count:
                              type: integer

  /analytics/top-content:
    get:
      operationId: getTopContent
      tags: [analytics]
      summary: Top viewed movies and series
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          schema: { type: string, format: date }
        - name: endDate
          in: query
          schema: { type: string, format: date }
        - name: period
          in: query
          schema: { type: string, enum: [7d, 30d, 90d, 1y] }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Top content list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            title:
                              type: string
                            type:
                              type: string
                            posterUrl:
                              type: ["string", "null"]
                            viewsCount:
                              type: integer
                            rating:
                              type: number

  /analytics/subscription-trend:
    get:
      operationId: getSubscriptionTrend
      tags: [analytics]
      summary: New subscriptions trend over time
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          schema: { type: string, format: date }
        - name: endDate
          in: query
          schema: { type: string, format: date }
        - name: period
          in: query
          schema: { type: string, enum: [7d, 30d, 90d, 1y] }
      responses:
        "200":
          description: Subscription trend data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                            newSubscriptions:
                              type: integer

  /analytics/invalidate-cache:
    post:
      operationId: invalidateAnalyticsCache
      tags: [analytics]
      summary: Invalidate analytics cache
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cache invalidated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  /analytics/video-codes:
    get:
      operationId: getVideoCodeStats
      tags: [analytics]
      summary: Get video code statistics
      security:
        - bearerAuth: []
      parameters:
        - name: groupBy
          in: query
          schema: { type: string, enum: [status, channel] }
      responses:
        "200":
          description: Video code stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  active:
                    type: integer
                  pending:
                    type: integer
                  views:
                    type: integer
                  topCodes:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        title:
                          type: string
                        viewsCount:
                          type: integer
                        status:
                          type: string

components:
  schemas:
    OverviewStats:
      type: object
      required: [totalUsers, activeUsers, totalMovies, totalSeries, totalEpisodes, activeSubscriptions, monthlyRevenue, totalRevenue]
      properties:
        totalUsers:
          type: integer
        activeUsers:
          type: integer
        newUsersToday:
          type: integer
        totalMovies:
          type: integer
        totalSeries:
          type: integer
        totalEpisodes:
          type: integer
        activeSubscriptions:
          type: integer
        monthlyRevenue:
          type: number
        totalRevenue:
          type: number
        totalWatchSessions:
          type: integer
        totalVideoCodes:
          type: integer
        activeVideoCodes:
          type: integer
        totalCodeViews:
          type: integer

    RevenueTrend:
      type: object
      properties:
        period:
          type: string
        totalRevenue:
          type: number
        totalTransactions:
          type: integer
        averageRevenue:
          type: number
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        data:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
              revenue:
                type: number
              transactions:
                type: integer

    TopContent:
      type: object
      properties:
        totalViews:
          type: integer
        averageViews:
          type: number
        period:
          type: object
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        limit:
          type: integer
        offset:
          type: integer
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              title:
                type: string
              type:
                type: string
              posterUrl:
                type: ["string", "null"]
              viewsCount:
                type: integer
              uniqueViewers:
                type: integer
              totalWatchTime:
                type: integer
              averageWatchTime:
                type: number
              completionRate:
                type: number
              rating:
                type: number
              ratingCount:
                type: integer

    SubscriptionTrend:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
              newSubscriptions:
                type: integer
              cancellations:
                type: integer
              active:
                type: integer
              trial:
                type: integer
              expired:
                type: integer
        totalNew:
          type: integer
        totalCancelled:
          type: integer
        netGrowth:
          type: integer
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
