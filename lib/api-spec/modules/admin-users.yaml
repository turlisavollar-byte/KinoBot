openapi: 3.1.0
info:
  title: Admin Users API
  version: 0.1.0
  description: Administrative accounts and role management

tags:
  - name: admin-users
    description: Administrative account operations

paths:
  /admin-users:
    get:
      operationId: listAdminUsers
      tags: [admin-users]
      summary: List administrative users
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by name, email, or role
      responses:
        "200":
          description: Administrative users retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccountListResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
  /admin-users/{id}:
    patch:
      operationId: updateAdminUser
      tags: [admin-users]
      summary: Update an administrative account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminUserBody"
      responses:
        "200": { description: Administrative account updated }
        "400": { description: Invalid request }
        "403": { description: Forbidden }
        "404": { description: Not found }
    delete:
      operationId: deleteAdminUser
      tags: [admin-users]
      summary: Delete an administrative account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Administrative account deleted }
        "403": { description: Forbidden }
        "404": { description: Not found }

components:
  schemas:
    AdminAccount:
      type: object
      required: [id, email, name, role, status, isActive, lastLoginAt, createdAt, updatedAt]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        role:
          type: string
          enum: [superadmin, admin, manager, moderator, user, viewer]
        status:
          type: string
          enum: [active, inactive, suspended]
        isActive: { type: boolean }
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AdminAccountListResponse:
      type: object
      required: [success, data, meta, timestamp]
      properties:
        success: { type: boolean }
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminAccount"
        meta:
          type: object
          required: [total]
          properties:
            total: { type: integer }
        timestamp:
          type: string
          format: date-time
    UpdateAdminUserBody:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        role:
          type: string
          enum: [superadmin, admin, manager, moderator, user, viewer]
