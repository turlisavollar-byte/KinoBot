openapi: 3.1.0
info:
  title: Admin Users API
  version: 0.1.0
  description: Administrative accounts and role management

tags:
  - name: admin-users
    description: Administrative account operations

paths:
  /admin-users:
    get:
      operationId: listAdminUsers
      tags: [admin-users]
      summary: List administrative users
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by name, email, or role
      responses:
        "200":
          description: Administrative users retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccountListResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
  /admin-users/{id}:
    get:
      operationId: getLegacyAdminUser
      tags: [admin-users]
      summary: Get a scoped administrative account (legacy path)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Whitelisted administrative account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccountDetailResponse"
        "403": { description: Forbidden }
        "404": { description: Not found }
    patch:
      operationId: updateAdminUser
      tags: [admin-users]
      summary: Update an administrative account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminUserBody"
      responses:
        "200": { description: Administrative account updated }
        "400": { description: Invalid request }
        "403": { description: Forbidden }
        "404": { description: Not found }
    delete:
      operationId: deleteAdminUser
      tags: [admin-users]
      summary: Delete an administrative account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Administrative account deleted }
        "403": { description: Forbidden }
        "404": { description: Not found }
  /admin-users/{id}/ban:
    post:
      operationId: setLegacyAdminUserBan
      tags: [admin-users]
      summary: Ban or unban an administrative account (legacy path)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BanAdminUserBody"
      responses:
        "200": { description: Administrative account status changed }
        "403": { description: Forbidden }
        "404": { description: Not found }
  /admin/users:
    get:
      operationId: listScopedAdminUsers
      tags: [admin-users]
      summary: List administrative accounts visible to the caller
      description: Super admins see all accounts; admins see their own and moderator accounts.
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Scoped administrative account list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccountListResponse"
        "401": { description: Unauthorized }
        "403": { description: Forbidden }
    post:
      operationId: createAdminUser
      tags: [admin-users]
      summary: Create an administrative account as Super Admin
      description: The password is hashed server-side, never returned, and must be changed on first login.
      security:
        - bearerAuth: []
      x-rate-limit:
        max: 5
        windowSeconds: 3600
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminUserBody"
      responses:
        "201":
          description: Administrative account created; no password or hash is returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAdminUserResponse"
        "400": { description: Invalid input or password policy failure }
        "401": { description: Unauthorized }
        "403": { description: Super Admin permission required }
        "409": { description: Email already exists }
        "429": { description: Rate limit exceeded }
  /admin/users/{id}:
    get:
      operationId: getScopedAdminUser
      tags: [admin-users]
      summary: Get a whitelisted administrative account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Whitelisted administrative account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccountDetailResponse"
        "403": { description: Forbidden }
        "404": { description: Not found }
    patch:
      operationId: updateScopedAdminUser
      tags: [admin-users]
      summary: Update an administrative account within caller role scope
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminUserBody"
      responses:
        "200": { description: Administrative account updated }
        "403": { description: Forbidden }
        "404": { description: Not found }
    delete:
      operationId: deleteScopedAdminUser
      tags: [admin-users]
      summary: Delete an administrative account within caller role scope
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Administrative account deleted }
        "403": { description: Forbidden }
        "404": { description: Not found }
  /admin/users/{id}/ban:
    post:
      operationId: setScopedAdminUserBan
      tags: [admin-users]
      summary: Deactivate or reactivate an administrative account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BanAdminUserBody"
      responses:
        "200": { description: Administrative account status changed }
        "403": { description: Forbidden }
        "404": { description: Not found }

components:
  schemas:
    AdminAccount:
      type: object
      required: [id, email, role, status, isActive, lastLoginAt, createdAt, updatedAt]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string, nullable: true }
        role:
          type: string
          enum: [superadmin, admin, manager, moderator, user, viewer]
        status:
          type: string
          enum: [active, inactive, suspended]
        isActive: { type: boolean }
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AdminAccountListResponse:
      type: object
      required: [success, data, meta, timestamp]
      properties:
        success: { type: boolean }
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminAccount"
        meta:
          type: object
          required: [total]
          properties:
            total: { type: integer }
        timestamp:
          type: string
          format: date-time
    AdminAccountDetailResponse:
      type: object
      required: [success, data, timestamp]
      properties:
        success: { type: boolean }
        data:
          $ref: "#/components/schemas/AdminAccount"
        timestamp:
          type: string
          format: date-time
    CreateAdminUserBody:
      type: object
      required: [email, role, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 255 }
        role:
          type: string
          enum: [admin, moderator]
        password:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
    CreateAdminUserResponse:
      type: object
      required: [success, data, timestamp]
      properties:
        success: { type: boolean }
        data:
          allOf:
            - $ref: "#/components/schemas/AdminAccount"
            - type: object
              required: [mustChangePassword]
              properties:
                mustChangePassword: { type: boolean }
        timestamp:
          type: string
          format: date-time
    BanAdminUserBody:
      type: object
      required: [banned]
      properties:
        banned: { type: boolean }
    UpdateAdminUserBody:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        role:
          type: string
          enum: [superadmin, admin, manager, moderator, user, viewer]
