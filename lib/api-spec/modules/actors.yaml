openapi: 3.1.0
info:
  title: Actors API
  version: 0.1.0
  description: Actor management

tags:
  - name: actors
    description: Actor management

paths:
  /actors:
    get:
      operationId: listActors
      tags: [actors]
      summary: List all actors
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Actors list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Actor"

    post:
      operationId: createActor
      tags: [actors]
      summary: Create a new actor
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateActorBody"
      responses:
        "201":
          description: Actor created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Actor"

  /actors/{id}:
    get:
      operationId: getActor
      tags: [actors]
      summary: Get actor profile and filmography
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Actor profile and movies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActorDetail"
        "404":
          description: Actor not found

    patch:
      operationId: updateActor
      tags: [actors]
      summary: Update actor
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateActorBody"
      responses:
        "200":
          description: Updated actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Actor"

    delete:
      operationId: deleteActor
      tags: [actors]
      summary: Delete actor
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Actor deleted

  /actors/{id}/movies:
    post:
      operationId: attachActorToMovie
      tags: [actors]
      summary: Add a movie to an actor filmography
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachActorToMovieBody"
      responses:
        "204":
          description: Movie attached
        "404":
          description: Actor or movie not found
        "409":
          description: Movie already attached

  /actors/{id}/movies/{movieId}:
    patch:
      operationId: updateActorMovieRole
      tags: [actors]
      summary: Update an actor role in a movie
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: movieId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateActorMovieRoleBody"
      responses:
        "204":
          description: Role updated
        "404":
          description: Actor/movie relation not found

    delete:
      operationId: detachActorFromMovie
      tags: [actors]
      summary: Remove a movie from an actor filmography
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: movieId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Movie detached
        "404":
          description: Actor/movie relation not found

components:
  schemas:
    Actor:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        photoUrl:
          type: string
        bio:
          type: string

    ActorDetail:
      type: object
      required: [id, name, movies, stats]
      properties:
        id:
          type: string
        name:
          type: string
        photoUrl:
          type: [string, "null"]
        bio:
          type: [string, "null"]
        birthDate:
          type: [string, "null"]
          format: date
        birthPlace:
          type: [string, "null"]
        movies:
          type: array
          items:
            type: object
            required: [movieId, title, videoCodes]
            properties:
              movieId:
                type: string
              title:
                type: string
              releaseYear:
                type: [integer, "null"]
              posterUrl:
                type: [string, "null"]
              role:
                type: [string, "null"]
              videoCodes:
                type: array
                items:
                  type: object
                  required: [id, code, status]
                  properties:
                    id:
                      type: string
                    code:
                      type: string
                    status:
                      type: string
        stats:
          type: object
          required: [moviesCount, totalViews]
          properties:
            moviesCount:
              type: integer
            totalViews:
              type: integer

    AttachActorToMovieBody:
      type: object
      required: [movieId]
      properties:
        movieId:
          type: string
        role:
          type: [string, "null"]
          maxLength: 255

    UpdateActorMovieRoleBody:
      type: object
      properties:
        role:
          type: [string, "null"]
          maxLength: 255

    CreateActorBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
        photoUrl:
          type: string
        bio:
          type: string

    UpdateActorBody:
      type: object
      properties:
        name:
          type: string
        photoUrl:
          type: string
        bio:
          type: string
