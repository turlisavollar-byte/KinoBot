name: v2 staging monitoring
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: v2-staging-monitor
  cancel-in-progress: true
jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: staging-monitoring
    steps:
      - name: Configure AWS credentials
        id: aws-credentials
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true
      - name: Probe staging health, errors, and resource metrics via SSM
        id: probe
        if: steps.aws-credentials.outcome == 'success'
        continue-on-error: true
        env:
          STAGING_INSTANCE_ID: ${{ secrets.STAGING_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test "$AWS_REGION" = "ap-southeast-2"
          test "$STAGING_INSTANCE_ID" = "i-0a9e38028ea1889bc"

          monitor_script=$(cat <<'SSM'
          set -eu
          sudo -u ubuntu bash -se <<'REMOTE'
          set -euo pipefail
          cd /opt/kinobot-v2-git
          api_http="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 http://127.0.0.1:3001/api/healthz || true)"
          nginx_http="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 http://127.0.0.1:8081/ || true)"
          nginx_https="$(curl --insecure --silent --output /dev/null --write-out '%{http_code}' --max-time 10 https://127.0.0.1:8443/ || true)"
          api_errors="$(sudo docker compose -f docker-compose.prod.yml logs --since=15m --no-color api-server 2>&1 | grep -Eic 'ERROR|FATAL|Exception' || true)"
          api_errors="${api_errors:-0}"
          printf 'METRIC api_health_http=%s\n' "$api_http"
          printf 'METRIC nginx_http=%s\n' "$nginx_http"
          printf 'METRIC nginx_https=%s\n' "$nginx_https"
          printf 'METRIC api_errors_15m=%s\n' "$api_errors"
          sudo docker stats --no-stream --format 'METRIC {{.Name}} cpu={{.CPUPerc}} memory={{.MemUsage}} memory_pct={{.MemPerc}}'
          sudo docker compose -f docker-compose.prod.yml ps
          test "$api_http" = "200"
          case "$nginx_http" in 200|301|302) ;; *) exit 1 ;; esac
          test "$nginx_https" = "200"
          test "$api_errors" -eq 0
          REMOTE
          SSM
          )
          parameters=$(jq -cn --arg commands "$monitor_script" '{commands: [$commands]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$STAGING_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Kinobot v2 staging monitoring ${GITHUB_SHA}" \
            --max-concurrency "1" \
            --max-errors "0" \
            --timeout-seconds 300 \
            --parameters "$parameters" \
            --query "Command.CommandId" \
            --output text)
          test -n "$command_id"
          test "$command_id" != "None"

          completed=false
          for attempt in $(seq 1 5); do
            if aws ssm wait command-executed --command-id "$command_id" --instance-id "$STAGING_INSTANCE_ID"; then
              completed=true
              break
            fi
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$STAGING_INSTANCE_ID" \
              --query "Status" \
              --output text)
            case "$status" in
              Success)
                completed=true
                break
                ;;
              Pending|InProgress|Delayed|Cancelling) ;;
              *)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$STAGING_INSTANCE_ID" \
                  --query '{Status:Status,StatusDetails:StatusDetails,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac
          done
          if [ "$completed" != "true" ]; then
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$STAGING_INSTANCE_ID" \
              --query '{Status:Status,StatusDetails:StatusDetails,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}' \
              --output json
            exit 1
          fi
          status=$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$STAGING_INSTANCE_ID" \
            --query "Status" \
            --output text)
          if [ "$status" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$STAGING_INSTANCE_ID" \
              --query '{Status:Status,StatusDetails:StatusDetails,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}' \
              --output json
            exit 1
          fi
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$STAGING_INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text
      - name: Create or update monitoring alert issue
        if: always() && (steps.aws-credentials.outcome == 'failure' || steps.probe.outcome == 'failure')
        uses: actions/github-script@v8
        env:
          AWS_CREDENTIALS_OUTCOME: ${{ steps.aws-credentials.outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        with:
          script: |
            const title = '[staging-monitor] v2 health or API errors';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const issue = issues.find((item) => item.title === title && !item.pull_request);
            const body = [
              'The automated v2 staging health/API log check failed.',
              '',
              `Commit: ${context.sha}`,
              `AWS credential setup: ${process.env.AWS_CREDENTIALS_OUTCOME}.`,
              `Staging probe: ${process.env.PROBE_OUTCOME}.`,
              `Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              'Raw application logs are intentionally not copied into this issue.',
            ].join('\n');
            if (issue) {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
      - name: Close monitoring alert after recovery
        if: always() && steps.aws-credentials.outcome == 'success' && steps.probe.outcome == 'success'
        uses: actions/github-script@v8
        with:
          script: |
            const title = '[staging-monitor] v2 health or API errors';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const issue = issues.find((item) => item.title === title && !item.pull_request);
            if (issue) {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
            }
      - name: Mark failed monitor run
        if: always() && (steps.aws-credentials.outcome == 'failure' || steps.probe.outcome == 'failure')
        run: |
          exit 1
